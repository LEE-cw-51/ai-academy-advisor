[project]
name = "ai-academy-advisor-backend"
version = "0.1.0"
description = "AI Academy Advisor backend (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.4",
    "pgvector>=0.3",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

# Vercel Python Functions가 app/main.py의 FastAPI 인스턴스를 단일 서버리스
# 함수로 서빙한다(catch-all). docs/decision-log.md 참고.
[tool.vercel]
entrypoint = "app.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

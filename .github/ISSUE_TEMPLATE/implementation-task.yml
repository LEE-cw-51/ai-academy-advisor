name: 구현 작업 (Implementation)
description: 코드 구현·리팩터링·버그 수정 — 주로 Cursor가 수행, 필요 시 Claude 설계 검토
title: "[Task] "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        요청받은 범위에서 **최소·명확한** 변경만 한다. 요청받지 않은 대규모 리팩터링은 하지 않는다.
        규칙: [AGENTS.md](../../AGENTS.md)

  - type: textarea
    id: goal
    attributes:
      label: 목적
      description: 무엇을, 왜.
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: 현재 동작 / 문제
      description: 재현 방법, 관련 파일, 로그가 있으면 함께.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 동작 / 완료 조건
      description: 무엇이 되면 이 작업이 끝난 것인가.
    validations:
      required: true

  - type: dropdown
    id: layer
    attributes:
      label: 영향 범위
      multiple: true
      options:
        - backend / api
        - backend / services
        - backend / repositories
        - backend / models · migration
        - backend / providers (LLM·임베딩·벡터)
        - frontend
        - data (data/academies/*.json)
        - docs
        - infra · 배포
    validations:
      required: false

  - type: textarea
    id: constraints
    attributes:
      label: 지켜야 할 계약 / 주의사항
      placeholder: |
        예) POST /recommendations 하드 필터 동작은 바꾸지 않는다
        예) scoring.py는 순수 모듈로 유지 (ORM import 금지)
    validations:
      required: false

  - type: checkboxes
    id: needs
    attributes:
      label: 필요한 것
      options:
        - label: Claude(CTO) 설계 검토가 먼저 필요하다
        - label: DB 마이그레이션이 포함된다
        - label: 외부 동작(API 계약)이 바뀐다 — `docs/api.md` 갱신 필요
        - label: 회귀 테스트 추가가 필요하다 (데이터·추천·provider 변경)

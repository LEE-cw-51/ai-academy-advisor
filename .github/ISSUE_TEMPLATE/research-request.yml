name: 조사 의뢰 (Research)
description: 웹 조사·복수 출처 검증·시장/경쟁사/데이터 소스 조사 — 주로 Manus가 수행
title: "[Research] "
labels: ["research"]
body:
  - type: markdown
    attributes:
      value: |
        조사 절차: **질문 정의 → 복수 독립 출처 수집 → 교차 검증 → 구조화 → 실행 제안**
        결과는 링크 목록이 아니라 의사결정에 바로 쓸 수 있는 형태로 남긴다.
        규칙: [AGENTS.md](../../AGENTS.md) · [docs/ai-team.md](../../docs/ai-team.md)

  - type: textarea
    id: question
    attributes:
      label: 조사 질문
      description: 답이 나왔을 때 무엇을 결정할 수 있는지까지 쓴다.
      placeholder: |
        예) 하남 미사 학원의 수강료 정보를 합법적으로 확보할 수 있는 공개 출처가 있는가?
        → 있다면 data/academies의 tuition_monthly_fee null 비율을 얼마나 줄일 수 있는가?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: 이 조사가 필요한 이유 / 연결된 결정
      description: 어떤 제품·기술 결정이 이 결과를 기다리고 있는가.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 범위와 제약
      description: 조사에 포함/제외할 것, 시간 제약, 예산 제약.
      placeholder: |
        - 로그인 담벼락 뒤 데이터(지역 맘카페 등)는 수집 원칙상 제외
        - 무료 티어로 검증 가능한 것 우선
    validations:
      required: false

  - type: textarea
    id: deliverable
    attributes:
      label: 기대 산출물
      value: |
        - [ ] 핵심 발견
        - [ ] 근거 / 출처 (독립 출처 2개 이상)
        - [ ] 불확실성 — 확인하지 못한 것
        - [ ] 사업적 함의
        - [ ] 다음 행동 제안
    validations:
      required: false

  - type: checkboxes
    id: rules
    attributes:
      label: 확인
      options:
        - label: 기존 `docs/decision-log.md`에서 이미 조사·결정된 내용이 아님을 확인했다
          required: true
        - label: 수집이 필요하다면 공개된 검증 가능 정보만 대상으로 한다 (`docs/data-strategy.md`)
          required: true

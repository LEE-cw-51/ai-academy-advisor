name: 학원 데이터 수정 (Data)
description: data/academies/*.json 정본의 사실 추가·수정 요청
title: "[Data] "
labels: ["data"]
body:
  - type: markdown
    attributes:
      value: |
        `data/academies/*.json`이 **유일한 git 정본**이고 DB는 파생 저장소다.
        수정 순서: **JSON 수정 → `--dry-run` 검증 / PR 리뷰 → 머지 → DB 임포트**
        학원 사실용 쓰기 API는 만들지 않는다. 원칙: [docs/data-strategy.md](../../docs/data-strategy.md)

  - type: input
    id: academy
    attributes:
      label: 대상 학원
      description: 이름 + 주소 (가능하면 `registration_number`)
    validations:
      required: true

  - type: textarea
    id: change
    attributes:
      label: 수정 내용
      description: 필드별로 "현재 값 → 바꿀 값".
      placeholder: |
        - phone: null → "031-000-0000"
        - subjects: null → ["수학"]
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: 출처 (source_note)
      description: 공개된 검증 가능한 출처. URL 또는 확인 경로.
    validations:
      required: true

  - type: input
    id: verified_at
    attributes:
      label: 확인일 (last_verified_at)
      placeholder: "2026-08-14"
    validations:
      required: true

  - type: checkboxes
    id: rules
    attributes:
      label: 데이터 정본 규칙 확인
      options:
        - label: 공개된 **검증 가능한** 정보다 (추측·휴리스틱으로 채운 값이 아니다)
          required: true
        - label: 확인하지 못한 필드는 `null`로 남겼다 (`false`와 혼동하지 않았다)
          required: true
        - label: 리뷰 원문·원시 수집 데이터를 정본 JSON에 넣지 않는다
          required: true
        - label: 자연키(`registration_number`, 없으면 `name`+`address`) 중복을 만들지 않는다
          required: true
